<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Loading Memories</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgMusic" loop>
  <source src="images/nadin.mpeg3" type="audio/mpeg">
</audio>
  <div class="phone" id="app">

    

    <!-- =========================
         LOADING SCREEN
    ========================== -->
    <section class="loading-screen" id="loadingScreen">

      <div class="heart-loader">♥</div>

      <div class="loading-title">
        LOADING MEMORIES
      </div>

      <div class="loading-line"></div>

      <div class="loading-dots">
        <span>.</span>
        <span>.</span>
        <span>.</span>
      </div>

    </section>


    <!-- =========================
         MEMORY SCREEN
    ========================== -->
    <section class="memory-screen" id="memoryScreen">

      <div class="ambient ambient-1"></div>
      <div class="ambient ambient-2"></div>

      <div class="word-field" id="wordField"></div>

      <div class="photo-field" id="photoField"></div>

      <div class="center-heart">
        ♥
      </div>

      <div class="final-message" id="finalMessage">
        you mean everything
      </div>

      <div class="vignette"></div>

    </section>


    <!-- Replay -->
    <button class="replay" id="replay">
      ↻ Replay
    </button>

  </div>


  <script src="script.js"></script>

</body>
</html>
