<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Loading Memories</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050305;
    font-family: "Trebuchet MS", Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================================
   CONTAINER 9:16
========================================= */

.app {
    position: relative;

    width: min(100vw, 720px);
    height: min(100vh, 1280px);

    aspect-ratio: 9 / 16;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(90, 15, 55, 0.15),
            transparent 50%
        ),
        #050305;

    color: #ff5ba8;
}

/* =========================================
   BACKGROUND
========================================= */

.background {
    position: absolute;
    inset: -20%;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(125, 12, 65, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(90, 0, 50, 0.12),
            transparent 35%
        );

    filter: blur(25px);

    animation: backgroundMove 12s ease-in-out infinite alternate;
}

@keyframes backgroundMove {

    0% {
        transform: scale(1);
    }

    100% {
        transform: scale(1.12);
    }
}

/* =========================================
   VIGNETTE
========================================= */

.vignette {
    position: absolute;
    inset: 0;

    z-index: 100;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0, 0, 0, 0.25) 60%,
            rgba(0, 0, 0, 0.85) 100%
        );
}

/* =========================================
   LOADING SCREEN
========================================= */

.loading-screen {
    position: absolute;
    inset: 0;

    z-index: 50;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #050305;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.loading-screen.hide {
    opacity: 0;
    visibility: hidden;
}

/* Fake touch / circle seen in reference */

.loading-circle {
    position: absolute;

    left: 65px;
    top: 230px;

    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: #8d8d8d;

    box-shadow:
        0 0 0 7px rgba(100,100,100,.18),
        0 0 0 14px rgba(100,100,100,.08),
        0 0 0 21px rgba(100,100,100,.04);
}

/* =========================================
   LOADING CONTENT
========================================= */

.loading-content {
    position: absolute;

    top: 51%;

    width: 100%;

    text-align: center;
}

.loading-title {
    color: rgba(255, 91, 168, 0.58);

    font-size: clamp(15px, 4vw, 26px);

    letter-spacing: 10px;

    font-weight: 300;

    margin-left: 10px;

    text-shadow:
        0 0 10px rgba(255, 40, 130, .18);

    animation:
        titlePulse 2s ease-in-out infinite;
}

@keyframes titlePulse {

    0%,
    100% {
        opacity: .45;
    }

    50% {
        opacity: .9;
    }
}

/* =========================================
   HEART
========================================= */

.heart {

    width: 50px;
    height: 50px;

    margin: 0 auto 28px;

    position: relative;

    transform: rotate(-45deg);

    background: #ff4f9c;

    filter:
        drop-shadow(0 0 8px #ff3f91)
        drop-shadow(0 0 20px rgba(255, 30, 130, .5));

    animation:
        heartBeat 1.2s infinite;
}

.heart::before,
.heart::after {

    content: "";

    position: absolute;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: #ff4f9c;
}

.heart::before {
    top: -25px;
    left: 0;
}

.heart::after {
    left: 25px;
    top: 0;
}

@keyframes heartBeat {

    0%,
    100% {
        transform:
            rotate(-45deg)
            scale(1);
    }

    50% {
        transform:
            rotate(-45deg)
            scale(1.12);
    }
}

/* =========================================
   PROGRESS BAR
========================================= */

.progress {
    width: 320px;
    max-width: 45vw;

    height: 2px;

    margin: 26px auto;

    background: rgba(255,255,255,.13);

    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;

    background: #ff65ad;

    box-shadow:
        0 0 10px #ff4c9f;

    animation:
        loadingProgress 2.8s linear forwards;
}

@keyframes loadingProgress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}

/* =========================================
   LOADING DOTS
========================================= */

.dots {
    display: flex;

    justify-content: center;

    gap: 10px;
}

.dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff559f;

    box-shadow:
        0 0 8px #ff3f91;

    animation:
        dotAnimation 1.2s infinite;
}

.dot:nth-child(2) {
    animation-delay: .2s;
}

.dot:nth-child(3) {
    animation-delay: .4s;
}

@keyframes dotAnimation {

    0%,
    100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================================
   MEMORY WALL
========================================= */

.memories {

    position: absolute;

    inset: 0;

    opacity: 0;

    transition: opacity 2s ease;

    overflow: hidden;
}

.memories.show {
    opacity: 1;
}

/* =========================================
   FLOATING TEXT
========================================= */

.word {

    position: absolute;

    white-space: nowrap;

    color: rgba(255, 91, 168, .34);

    font-size: clamp(18px, 4vw, 34px);

    font-weight: 300;

    letter-spacing: 1px;

    text-shadow:
        0 0 10px rgba(255, 30, 130, .12);

    user-select: none;

    animation:
        textFloat var(--duration)
        ease-in-out infinite alternate;

}

@keyframes textFloat {

    from {
        transform:
            translate3d(
                var(--x1),
                var(--y1),
                0
            );
    }

    to {
        transform:
            translate3d(
                var(--x2),
                var(--y2),
                0
            );
    }
}

/* =========================================
   PHOTO CARD
========================================= */

.photo {

    position: absolute;

    width: 145px;
    height: 145px;

    object-fit: cover;

    border-radius: 18px;

    opacity: .82;

    filter:
        brightness(.82)
        contrast(.92)
        saturate(.85);

    box-shadow:
        0 0 12px rgba(255, 80, 160, .08);

    animation:
        photoFloat var(--duration)
        ease-in-out infinite alternate;

    transition:
        transform .4s ease,
        filter .4s ease;
}

.photo:hover {

    filter:
        brightness(1)
        contrast(1)
        saturate(1);

    z-index: 20;
}

@keyframes photoFloat {

    from {
        transform:
            translate(
                var(--x1),
                var(--y1)
            )
            rotate(var(--r1));
    }

    to {
        transform:
            translate(
                var(--x2),
                var(--y2)
            )
            rotate(var(--r2));
    }
}

/* =========================================
   CENTER GLOW
========================================= */

.center-glow {

    position: absolute;

    width: 350px;
    height: 350px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(130, 10, 70, .15),
            transparent 70%
        );

    filter: blur(25px);

    animation:
        glowMove 8s infinite alternate;
}

@keyframes glowMove {

    from {
        transform:
            translate(-50%, -50%)
            scale(.8);
    }

    to {
        transform:
            translate(-50%, -50%)
            scale(1.2);
    }
}

/* =========================================
   AUDIO BUTTON
========================================= */

.music-button {

    position: absolute;

    right: 28px;
    bottom: 28px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid rgba(255, 80, 160, .45);

    background:
        rgba(20, 5, 15, .75);

    color: #ff4c9f;

    font-size: 22px;

    z-index: 200;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255, 50, 150, .15);
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    .photo {
        width: 115px;
        height: 115px;
        border-radius: 16px;
    }

    .loading-title {
        font-size: 15px;
        letter-spacing: 7px;
    }

    .progress {
        width: 320px;
        max-width: 45vw;
    }

    .loading-circle {
        left: 65px;
        top: 230px;
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="background"></div>

    <!-- LOADING -->

    <section class="loading-screen" id="loadingScreen">

        <div class="loading-circle"></div>

        <div class="loading-content">

            <div class="heart"></div>

            <div class="loading-title">
                LOADING MEMORIES
            </div>

            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <div class="dots">

                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>

            </div>

        </div>

    </section>


    <!-- MEMORY WALL -->

    <section
        class="memories"
        id="memories">

        <div class="center-glow"></div>

        <!-- TEXT AKAN DIBUAT JAVASCRIPT -->

    </section>


    <!-- VIGNETTE -->

    <div class="vignette"></div>


    <!-- MUSIC -->

    <button
        class="music-button"
        id="musicButton">

        ♪

    </button>

</div>


<script>

/* =========================================
   PENGATURAN
========================================= */

const CONFIG = {

    loadingDuration: 3000,

    photoSize: 145,

    texts: [

        "you mean everything",
        "only you",
        "stay with me",
        "forever",
        "always with you",
        "i miss you",
        "my favorite person",
        "always on my mind",
        "my safe place",
        "love u more",
        "thinking of you",
        "you are enough",
        "i love you",
        "stay forever",
        "always you",
        "only one",
        "my person",
        "miss you",
        "with you",
        "forever yours"

    ]

};


/* =========================================
   FOTO
========================================= */

/*
    Masukkan foto ke folder:

    images/
        foto1.jpg
        foto2.jpg
        foto3.jpg
        foto4.jpg

*/

const photos = [

    "images/foto1.jpeg.jpeg",
    "images/foto2.jpeg.jpeg",
    "images/foto3.jpeg.jpeg",
    "images/foto4.jpeg.jpeg",
    "images/foto5.jpeg.jpeg",

];


/* =========================================
   ELEMENT
========================================= */

const memories =
    document.getElementById("memories");

const loading =
    document.getElementById("loadingScreen");


/* =========================================
   RANDOM
========================================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


/* =========================================
   CREATE TEXT
========================================= */

function createWords() {

    CONFIG.texts.forEach((text, index) => {

        const element =
            document.createElement("div");

        element.className = "word";

        element.innerText = text;

        /*
            Posisi awal
        */

        const x1 =
            random(-50, 650);

        const y1 =
            random(-100, 1200);

        /*
            Posisi akhir
        */

        const x2 =
            x1 + random(-80, 80);

        const y2 =
            y1 + random(-100, 100);

        element.style.left = "0px";

        element.style.top = "0px";

        element.style.setProperty(
            "--x1",
            `${x1}px`
        );

        element.style.setProperty(
            "--y1",
            `${y1}px`
        );

        element.style.setProperty(
            "--x2",
            `${x2}px`
        );

        element.style.setProperty(
            "--y2",
            `${y2}px`
        );

        element.style.setProperty(
            "--duration",
            `${random(5, 12)}s`
        );

        /*
            Ukuran acak
        */

        element.style.fontSize =
            `${random(17, 34)}px`;

        /*
            Opacity acak
        */

        element.style.opacity =
            random(.15, .55);

        memories.appendChild(element);

    });

}


/* =========================================
   CREATE PHOTOS
========================================= */

function createPhotos() {

    photos.forEach((src, index) => {

        const img =
            document.createElement("img");

        img.className = "photo";

        img.src = src;

        /*
            Posisi
        */

        const x1 =
            random(20, 560);

        const y1 =
            random(50, 1050);

        const x2 =
            x1 + random(-80, 80);

        const y2 =
            y1 + random(-100, 100);

        /*
            Rotation
        */

        const r1 =
            random(-5, 5);

        const r2 =
            random(-5, 5);

        img.style.left = "0px";

        img.style.top = "0px";

        img.style.setProperty(
            "--x1",
            `${x1}px`
        );

        img.style.setProperty(
            "--y1",
            `${y1}px`
        );

        img.style.setProperty(
            "--x2",
            `${x2}px`
        );

        img.style.setProperty(
            "--y2",
            `${y2}px`
        );

        img.style.setProperty(
            "--r1",
            `${r1}deg`
        );

        img.style.setProperty(
            "--r2",
            `${r2}deg`
        );

        img.style.setProperty(
            "--duration",
            `${random(5, 10)}s`
        );

        /*
            Ukuran sedikit berbeda
        */

        const size =
            random(105, 155);

        img.style.width =
            `${size}px`;

        img.style.height =
            `${size}px`;

        /*
            Layer
        */

        img.style.zIndex =
            Math.floor(random(1, 10));

        memories.appendChild(img);

    });

}


/* =========================================
   MULAI
========================================= */

createWords();

createPhotos();


/* =========================================
   LOADING SELESAI
========================================= */

setTimeout(() => {

    loading.classList.add("hide");

    setTimeout(() => {

        memories.classList.add("show");

    }, 400);

}, CONFIG.loadingDuration);


/* =========================================
   MUSIC
========================================= */

const musicButton =
    document.getElementById("musicButton");

let audio = null;

musicButton.addEventListener(
    "click",
    () => {

        /*
            Buat file:

            music.m4r

            lalu aktifkan kode ini.
        */

        if (!audio) {

            audio =
                new Audio("music.m4r");

            audio.loop = true;

        }

        if (audio.paused) {

            audio.play();

            musicButton.innerText =
                "❚❚";

        } else {

            audio.pause();

            musicButton.innerText =
                "♪";

        }

    }
);


/* =========================================
   PARALLAX TOUCH
========================================= */

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;


document.addEventListener(
    "mousemove",
    (event) => {

        targetX =
            (event.clientX / window.innerWidth - .5)
            * 20;

        targetY =
            (event.clientY / window.innerHeight - .5)
            * 20;

    }
);


document.addEventListener(
    "touchmove",
    (event) => {

        if (!event.touches.length)
            return;

        const touch =
            event.touches[0];

        targetX =
            (touch.clientX / window.innerWidth - .5)
            * 20;

        targetY =
            (touch.clientY / window.innerHeight - .5)
            * 20;

    }
);


/* =========================================
   SMOOTH CAMERA
========================================= */

function animateCamera() {

    currentX +=
        (targetX - currentX) * .03;

    currentY +=
        (targetY - currentY) * .03;

    memories.style.transform =
        `translate3d(
            ${currentX}px,
            ${currentY}px,
            0
        )`;

    requestAnimationFrame(
        animateCamera
    );
}

animateCamera();

</script>

</body>
</html>
